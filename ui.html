<main>
  <header>
    <div>
      <h1>Variables JSON</h1>
      <p id="status">Loading variables...</p>
    </div>
    <button id="close" type="button" title="Close plugin">Close</button>
  </header>

  <section class="toolbar" aria-label="Export controls">
    <button id="refresh" type="button">Refresh</button>
    <button id="download" type="button">Download</button>
  </section>

  <div class="download-group" aria-label="Tailwind 4 downloads">
    <h2>Tailwind 4</h2>
    <div class="toolbar">
    <button id="download-base-css" type="button">Download base.css</button>
    <button id="download-color-tokens-css" type="button">Download color-tokens.css</button>
    <button id="download-typography-css" type="button">Download typography.css</button>
    </div>
  </div>

  <dl class="stats" aria-label="Variable export summary">
    <div>
      <dt>Collections</dt>
      <dd id="collection-count">0</dd>
    </div>
    <div>
      <dt>Variables</dt>
      <dd id="variable-count">0</dd>
    </div>
    <div>
      <dt>Color Variables</dt>
      <dd id="color-variable-count">0</dd>
    </div>
  </dl>
</main>

<style>
  html,
  body {
    height: 100%;
    margin: 0;
  }

  body {
    color: #1f2328;
    background: #ffffff;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Arial, sans-serif;
  }

  main {
    box-sizing: border-box;
    display: grid;
    grid-template-rows: auto auto auto auto;
    gap: 12px;
    height: auto;
    padding: 16px;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  h1 {
    margin: 0;
    font-size: 18px;
    line-height: 24px;
    font-weight: 650;
  }

  h2 {
    margin: 0;
    color: #1f2328;
    font-size: 13px;
    line-height: 18px;
    font-weight: 650;
  }

  p {
    margin: 4px 0 0;
    color: #626a73;
    font-size: 12px;
    line-height: 18px;
  }

  button {
    min-height: 32px;
    height: 32px;
    border: 1px solid #c9ced6;
    border-radius: 6px;
    padding: 0 12px;
    color: #1f2328;
    background: #ffffff;
    font: inherit;
    font-size: 12px;
    line-height: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #f4f6f8;
  }

  button:active {
    background: #e9edf2;
  }

  button:disabled {
    color: #8b949e;
    cursor: default;
    background: #f6f8fa;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .download-group {
    display: grid;
    gap: 8px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin: 0;
  }

  .stats div {
    border: 1px solid #d8dee4;
    border-radius: 6px;
    padding: 10px;
    background: #f6f8fa;
  }

  dt {
    margin: 0;
    color: #626a73;
    font-size: 11px;
    line-height: 14px;
  }

  dd {
    margin: 2px 0 0;
    color: #1f2328;
    font-size: 18px;
    line-height: 24px;
    font-weight: 650;
  }

</style>

<script>
  const statusEl = document.getElementById("status");
  const collectionCountEl = document.getElementById("collection-count");
  const variableCountEl = document.getElementById("variable-count");
  const colorVariableCountEl = document.getElementById("color-variable-count");
  const refreshButton = document.getElementById("refresh");
  const downloadButton = document.getElementById("download");
  const downloadBaseCssButton = document.getElementById("download-base-css");
  const downloadColorTokensCssButton = document.getElementById("download-color-tokens-css");
  const downloadTypographyCssButton = document.getElementById("download-typography-css");
  const closeButton = document.getElementById("close");

  let currentJson = "";
  let currentBaseCss = "";
  let currentColorTokensCss = "";
  let currentTypographyCss = "";
  let currentFileName = "figma-variables";

  function postPluginMessage(message) {
    parent.postMessage({ pluginMessage: message }, "*");
  }

  function setBusy(isBusy) {
    refreshButton.disabled = isBusy;
    downloadButton.disabled = isBusy || !currentJson;
    downloadBaseCssButton.disabled = isBusy || !currentBaseCss;
    downloadColorTokensCssButton.disabled = isBusy || !currentColorTokensCss;
    downloadTypographyCssButton.disabled = isBusy || !currentTypographyCss;
  }

  function setStatus(message) {
    statusEl.textContent = message;
  }

  function setCounts(collectionCount, variableCount, colorVariableCount) {
    collectionCountEl.textContent = String(collectionCount);
    variableCountEl.textContent = String(variableCount);
    colorVariableCountEl.textContent = String(colorVariableCount);
  }

  function normalizeFileName(name) {
    return String(name || "figma-variables")
      .trim()
      .replace(/[^a-z0-9-_]+/gi, "-")
      .replace(/^-+|-+$/g, "")
      .toLowerCase();
  }

  function showLoading() {
    setBusy(true);
    setStatus("Loading variables...");
  }

  function showVariablesJson(data) {
    currentJson = JSON.stringify(data, null, 2);
    currentBaseCss = data.baseCss || "";
    currentColorTokensCss = data.colorTokensCss || "";
    currentTypographyCss = data.typographyCss || "";
    currentFileName = normalizeFileName(data.fileName);

    setCounts(data.collectionCount, data.variableCount, data.colorVariableCount || 0);
    setStatus(
      `Ready to export ${data.variableCount} variables and ${data.colorVariableCount || 0} colors.`,
    );
    setBusy(false);
  }

  function showError(error) {
    currentJson = "";
    currentBaseCss = "";
    currentColorTokensCss = "";
    currentTypographyCss = "";
    setCounts(0, 0, 0);
    setStatus(`Export failed: ${error}`);
    setBusy(false);
  }

  function downloadJson() {
    if (!currentJson) return;

    const blob = new Blob([currentJson], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `${currentFileName || "figma-variables"}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    setStatus("JSON download started.");
  }

  function downloadCssFile(fileName, contents) {
    if (!contents) return;

    const blob = new Blob([contents], { type: "text/css" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  function downloadBaseCss() {
    downloadCssFile("base.css", currentBaseCss);
    setStatus("base.css download started.");
  }

  function downloadColorTokensCss() {
    downloadCssFile("color-tokens.css", currentColorTokensCss);
    setStatus("color-tokens.css download started.");
  }

  function downloadTypographyCss() {
    downloadCssFile("typography.css", currentTypographyCss);
    setStatus("typography.css download started.");
  }

  refreshButton.addEventListener("click", () => {
    postPluginMessage({ type: "refresh-variables" });
  });

  downloadButton.addEventListener("click", downloadJson);
  downloadBaseCssButton.addEventListener("click", downloadBaseCss);
  downloadColorTokensCssButton.addEventListener("click", downloadColorTokensCss);
  downloadTypographyCssButton.addEventListener("click", downloadTypographyCss);

  closeButton.addEventListener("click", () => {
    postPluginMessage({ type: "close-plugin" });
  });

  window.onmessage = (event) => {
    const pluginMessage = event.data && event.data.pluginMessage;
    if (!pluginMessage) return;

    if (pluginMessage.type === "variables-loading") {
      showLoading();
      return;
    }

    if (pluginMessage.type === "variables-json") {
      showVariablesJson(pluginMessage.data);
      return;
    }

    if (pluginMessage.type === "variables-error") {
      showError(pluginMessage.error);
    }
  };

  setBusy(true);
</script>
